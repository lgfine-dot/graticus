[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Netlify Functions v2 syntax (default export, Request/Response) needs Node 18+.
  NODE_VERSION = "20"

# The contact form posts to netlify/functions/contact.mts, which holds the
# Resend API key server-side so the static export can stay a static export.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
